        "</div>"
      );
    }).join("");

    return (
      '<div class="modal-head">' +
        "<div>" +
          '<div class="modal-eyebrow">' + formatWeekRange(monday) + "</div>" +
          '<div class="modal-title">Planejar a semana</div>' +
        "</div>" +
        '<button type="button" class="modal-close" data-action="modal-close-btn" aria-label="Fechar">×</button>' +
      "</div>" +
      '<div class="plan-days">' + daysHtml + "</div>"
    );
  }

  function reportHtml() {
    var monday = getMonday(new Date());
    var dates = currentWeekdayDates();
    var totalDone = 0, totalAll = 0;
    var daysHtml = dates.map(function (d) {
      var key = isoDate(d);
      var tasks = tasksFor(key);
      var doneCount = tasks.filter(function (t) { return t.done; }).length;
      totalDone += doneCount;
      totalAll += tasks.length;
      var itemsHtml = tasks.length
        ? tasks.map(function (t) {
            return '<li class="report-item' + (t.done ? " done" : "") + '"><span class="report-mark">' +
              (t.done ? "✓" : "·") + "</span>" + escapeHtml(t.text) + "</li>";
          }).join("")
        : '<li class="report-item empty">Sem tarefas</li>';
      var label = WEEKDAY_FULL[d.getDay()] + " · " + d.getDate() + " " + MONTHS[d.getMonth()];
      return (
        '<div class="report-day">' +
          '<div class="report-day-head"><span>' + label + '</span><span class="mono">' + doneCount + "/" + tasks.length + "</span></div>" +
          '<ul class="report-list">' + itemsHtml + "</ul>" +
        "</div>"
      );
    }).join("");
    var pct = totalAll ? Math.round((totalDone / totalAll) * 100) : 0;

    return (
      '<div class="modal-head">' +
        "<div>" +
          '<div class="modal-eyebrow">' + formatWeekRange(monday) + "</div>" +
          '<div class="modal-title">Relatório da semana</div>' +
        "</div>" +
        '<button type="button" class="modal-close" data-action="modal-close-btn" aria-label="Fechar">×</button>' +
      "</div>" +
      '<div class="report-summary">' +
        '<div class="report-pct">' + pct + "%</div>" +
        '<div class="report-summary-text">' + totalDone + " de " + totalAll + " tarefas concluídas</div>" +
      "</div>" +
      '<div class="report-days">' + daysHtml + "</div>" +
      '<div class="modal-actions">' +
        '<a class="btn-ghost" href="https://wa.me/?text=' + encodeURIComponent(buildWhatsAppText()) + '" target="_blank" rel="noopener noreferrer">Enviar por WhatsApp</a>' +
      "</div>"
    );
  }

  function renderModal() {
    if (!openModal) return "";
    var inner = openModal.type === "day" ? dayDrawerHtml(openModal.key) :
      openModal.type === "week" ? weekPlanHtml() : reportHtml();
    var wideClass = (openModal.type === "report" || openModal.type === "week") ? " modal-card--wide" : "";
    return (
      '<div class="modal-overlay">' +
        '<div class="modal-card' + wideClass + '" role="dialog" aria-modal="true">' + inner + "</div>" +
      "</div>"
    );
  }

  function render() {
    var monday = getMonday(new Date());
    app.innerHTML =
      '<div class="topbar">' +
        '<div class="title-block">' +
          "<h1>Semana à Vista</h1>" +
          '<div class="weekrange mono">' + formatWeekRange(monday) + "</div>" +
        "</div>" +
        '<div class="actions">' +
          '<span class="status" id="status" data-state="idle"><span class="dot"></span><span id="status-text">—</span></span>' +
          '<button type="button" class="btn-ghost" id="save-btn">Salvar agora</button>' +
          '<button type="button" class="btn-ghost" id="plan-btn">Planejar a semana</button>' +
          '<button type="button" class="btn-ghost" id="report-btn">Relatório semanal</button>' +
        "</div>" +
      "</div>" +
      '<div class="board">' + buildBoard() + "</div>" +
      '<p class="footnote">Clique num dia útil do calendário pra ver e planejar o que precisa ser feito nele.</p>' +
      renderModal();

    updateStatus(artifactNS ? "saved" : "local");
  }

  function updateStatus(kind) {
    var el = document.getElementById("status");
    var txt = document.getElementById("status-text");
    if (!el || !txt) return;
    var labels = {
      idle: "—",
      saving: "Salvando…",
      saved: "Salvo",
      error: "Salvar",
      local: "Salvar"
    };
    el.setAttribute("data-state", kind);
    txt.textContent = labels[kind] || "—";
  }

  function buildWhatsAppText() {
    var monday = getMonday(new Date());
    var dates = currentWeekdayDates();
    var lines = ["*Semana à Vista* (" + formatWeekRange(monday) + ")", ""];
    dates.forEach(function (d) {
      var key = isoDate(d);
      var tasks = tasksFor(key);
      lines.push("*" + WEEKDAY_FULL[d.getDay()] + " · " + d.getDate() + " " + MONTHS[d.getMonth()] + "*");
      if (!tasks.length) {
        lines.push("_(sem tarefas)_");
      } else {
        tasks.forEach(function (t) {
          lines.push((t.done ? "✅" : "⬜") + " " + t.text);
        });
      }
      lines.push("");
    });
    return lines.join("\n").trim();
  }

  function buildWhatsAppTextForDay(dateKey) {
    var d = parseKey(dateKey);
    var tasks = tasksFor(dateKey);
    var lines = ["*" + formatFullDate(d) + "*", ""];
    if (!tasks.length) {
      lines.push("_(sem tarefas)_");
    } else {
      tasks.forEach(function (t) {
        lines.push((t.done ? "✅" : "⬜") + " " + t.text);
      });
    }
    return lines.join("\n").trim();
  }

  function buildFullDocument(newState) {
    return (
      "<!doctype html>\n" +
      '<html lang="pt-BR">\n' +
      "<head>\n" +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      "<title>Semana à Vista</title>\n" +
      ICON_TAGS_SRC + "\n" +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">\n' +
      '<style id="page-style">' + CSS_SRC + "</style>\n" +
      "</head>\n" +
      "<body>\n" +
      '<div id="app"><p class="empty">Carregando…</p></div>\n' +
      '<script id="data" type="application/json">' + JSON.stringify(newState) + "<" + "/script>\n" +
      "<script>" + SCRIPT_SRC + "<" + "/script>\n" +
      "</body>\n" +
      "</html>"
    );
  }

  function persist() {
    dirty = true;
    render();
    if (!artifactNS) {
      updateStatus("local");
      return;
    }
    updateStatus("saving");
    artifactNS.publish(buildFullDocument(state)).then(function () {
      dirty = false;
      updateStatus("saved");
    }).catch(function () {
      updateStatus("error");
    });
  }

  app.addEventListener("submit", function (ev) {
    var form = ev.target.closest('form[data-action="add"]');
    if (!form) return;
    ev.preventDefault();
    var input = form.querySelector('input[name="text"]');
    var text = (input.value || "").trim();
    if (!text) return;
    var key = form.getAttribute("data-date");
    ensureDate(key).push({ id: makeId(), text: text, done: false });
    input.value = "";
    persist();
  });

  app.addEventListener("click", function (ev) {
    if (ev.target.classList && ev.target.classList.contains("modal-overlay")) {
      openModal = null;
      render();
      return;
    }
    if (ev.target.closest('[data-action="modal-close-btn"]')) {
      openModal = null;
      render();
      return;
    }
    var openDay = ev.target.closest('[data-action="open-day"]');
    if (openDay) {
      openModal = { type: "day", key: openDay.getAttribute("data-date") };
      render();
      return;
    }
    if (ev.target.id === "save-btn") {
      persist();
      return;
    }
    if (ev.target.id === "plan-btn") {
      openModal = { type: "week" };
      render();
      return;
    }
    if (ev.target.id === "report-btn") {
      openModal = { type: "report" };
      render();
      return;
    }
    var calAction = ev.target.closest('[data-action="cal-prev"], [data-action="cal-next"], [data-action="cal-today"]');
    if (calAction) {
      var act = calAction.getAttribute("data-action");
      if (act === "cal-prev") {
        viewMonth--;
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      } else if (act === "cal-next") {
        viewMonth++;
        if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      } else if (act === "cal-today") {
        var t = new Date();
        viewMonth = t.getMonth();
        viewYear = t.getFullYear();
      }
      render();
      return;
    }

    var del = ev.target.closest('[data-action="delete"]');
    if (del) {
      var dKey = del.getAttribute("data-date");
      var id = del.getAttribute("data-id");
      state.tasks[dKey] = (state.tasks[dKey] || []).filter(function (t) { return t.id !== id; });
      persist();
    }
  });

  app.addEventListener("change", function (ev) {
    var chk = ev.target.closest('[data-action="toggle"]');
    if (!chk) return;
    var dKey = chk.getAttribute("data-date");
    var id = chk.getAttribute("data-id");
    var task = (state.tasks[dKey] || []).find(function (t) { return t.id === id; });
    if (task) task.done = chk.checked;
    persist();
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && openModal) {
      openModal = null;
      render();
    }
  });

  window.addEventListener("beforeunload", function (ev) {
    if (dirty) {
      ev.preventDefault();
      ev.returnValue = "";
    }
  });

  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (ns) {
      artifactNS = ns;
      updateStatus(artifactNS ? "saved" : "local");
    }).catch(function () {
      artifactNS = null;
      updateStatus("local");
    });
  } else {
    updateStatus("local");
  }
})();
</script>
